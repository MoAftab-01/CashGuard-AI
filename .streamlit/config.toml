[theme]
primaryColor = "#0D9488"
font = "sans serif"

[theme.light]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EDF2F7"
textColor = "#10213A"

[theme.light.sidebar]
backgroundColor = "#10213A"
secondaryBackgroundColor = "#1C304D"
textColor = "#F1F5F9"
primaryColor = "#2DD4BF"

[theme.dark]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#152238"
textColor = "#E2E8F0"
primaryColor = "#2DD4BF"

[theme.dark.sidebar]
backgroundColor = "#0F1C30"
secondaryBackgroundColor = "#1C304D"
textColor = "#E2E8F0"

[server]
address = "127.0.0.1"
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
